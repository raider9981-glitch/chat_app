on:
  push:
    branches:
      - main
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      - name: Create iOS App Archive
        run: |
          mkdir -p ios-build
          cp -R build/ios/iphoneos/Runner.app ios-build/Runner.app
      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: chat-app-ios
          path: ios-build/Runner.app
        
